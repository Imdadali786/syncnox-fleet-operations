<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syncnox — Fleet operations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap');

  body{margin:0;background:#fff}
  #fl{
    --gray-10:#f4f4f4; --gray-20:#e0e0e0; --gray-30:#c6c6c6; --gray-50:#8d8d8d; --gray-70:#525252; --ink:#161616;
    --accent:#015c11; --bright:#00c80d; --g-050:#EAF3DA;
    --muted:var(--gray-70); --faint:var(--gray-50);
    --grad:linear-gradient(90deg,#015c11,#00c80d);
    --scr:#FBFCF8; --scr-bar:#F2F4EC; --sub:#5A6B45;
    --blue:#0f62fe; --blue-050:#edf5ff; --red:#da1e28; --red-050:#fff1f1; --orange:#ff832b; --orange-ink:#c65300; --orange-050:#fff2e8;
    --purple:#8a3ffc; --purple-050:#f6f2ff; --teal:#007d79;
    --f:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.2,0,.38,.9); --ease-soft:cubic-bezier(.16,1,.3,1); --ease-out:cubic-bezier(.22,1,.36,1);
    font-family:var(--f);color:var(--muted);line-height:1.5;-webkit-font-smoothing:antialiased;
    font-feature-settings:"zero" 0,"ss01" 0;font-variant-numeric:lining-nums tabular-nums;
    background:#fff;padding:clamp(64px,8vw,112px) 0;position:relative;
  }
  #fl *,#fl *::before,#fl *::after{box-sizing:border-box;border-radius:0}
  #fl .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  #fl svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ---------- header ---------- */
  #fl .sec-head{text-align:center;max-width:760px;margin:0 auto clamp(32px,4vw,48px)}
  #fl .eyebrow{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px;margin:0 0 18px}
  #fl .eyebrow::before{content:"";width:22px;height:3px;background:var(--grad)}
  #fl h2{font-weight:400;letter-spacing:-.025em;line-height:1.06;font-size:clamp(30px,3.9vw,46px);margin:0;
    background:linear-gradient(100deg,#0A0A0A 0%,#013a0b 46%,#00c80d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  #fl h2 .hl{font-weight:600}
  #fl .sec-head p{margin:18px auto 0;font-size:1.04rem;line-height:1.6;max-width:52ch}

  /* ---------- lens tabs ---------- */
  #fl .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:clamp(10px,1.6vw,22px);margin-bottom:18px}
  #fl .tab{position:relative;display:flex;align-items:center;gap:12px;padding:16px 0 4px;background:none;border:none;cursor:pointer;font-family:inherit;color:var(--faint);text-align:left;font-size:.92rem;font-weight:600;letter-spacing:-.01em;line-height:1.25;transition:color .3s}
  #fl .tab .b2{position:absolute;left:0;right:0;top:0;height:3px;background:var(--gray-10);overflow:hidden}
  #fl .tab .b2 i{display:block;height:100%;width:0;background:var(--lc)}
  #fl .tab.on .b2 i{width:100%}
  #fl .tab.on.run .b2 i{width:0;animation:flFill var(--dw,10000ms) linear forwards}
  #fl .tab.on.run.hold .b2 i{animation-play-state:paused}
  @keyframes flFill{to{width:100%}}
  #fl .tab .pi{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--gray-10);color:var(--faint);transition:background .3s,color .3s}
  #fl .tab .pi svg{width:16px;height:16px}
  #fl .tab:hover{color:var(--ink)}
  #fl .tab:hover .pi{color:var(--lc)}
  #fl .tab.on{color:var(--ink)}
  #fl .tab.on .pi{background:var(--lc);color:#fff}
  #fl .tab:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  #fl .tname{display:none;margin:-6px 0 14px;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lt,#161616)}
  #fl .tname em{font-style:normal;color:var(--gray-30);margin-right:8px}

  /* ---------- frame + screen ---------- */
  #fl .frame{position:relative;background:linear-gradient(150deg,#000 0%,#013a0b 42%,#00c80d 100%);padding:clamp(10px,2.6vw,34px);overflow:hidden}
  #fl .frame::before{content:"";position:absolute;inset:0;background:radial-gradient(560px circle at var(--mx,24%) var(--my,14%),rgba(90,255,120,.42),rgba(0,200,13,.15) 46%,transparent 74%);pointer-events:none}
  #fl .scr{position:relative;z-index:1;background:var(--scr);box-shadow:0 30px 60px rgba(8,16,4,.45)}
  #fl .bar{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 16px;background:var(--scr-bar);font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink)}
  #fl .bar .sq{width:8px;height:8px;background:var(--accent);flex:none}
  #fl .bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fl .bar .t em{font-style:normal;color:var(--faint);font-weight:500}
  #fl .clk{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--ink);white-space:nowrap}
  #fl .clk .lv{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.1em;padding:3px 6px;background:var(--accent);color:#fff;transition:background .3s}
  #fl .clk .lv i{width:5px;height:5px;background:#9CFF8F;animation:flBlink 1.2s steps(1) infinite}
  #fl .clk .lv.rp{background:var(--blue)}
  #fl .clk .lv.rp i{background:#fff}
  @keyframes flBlink{50%{opacity:.25}}
  #fl .ib{width:30px;height:30px;flex:none;border:none;background:none;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
  #fl .ib:hover{background:#fff;color:var(--ink)}
  #fl .ib svg{width:15px;height:15px}
  #fl .ib:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  #fl .body{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:2px;padding:12px 14px 16px}

  /* ---------- map ---------- */
  #fl .mcol{display:flex;flex-direction:column;min-width:0;background:#fff}
  #fl .map{position:relative;flex:1 1 auto;background:#F2F2EE;aspect-ratio:16/10;overflow:hidden;min-width:0}
  #fl .mfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:0 10px}
  #fl .map svg.m{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fl .map .rt,#fl .map .tr,#fl .map .stp,#fl .map .veh{transition:opacity .45s var(--ease)}
  #fl .map.dim .grp:not(.focus){opacity:.18}
  #fl .map .ov{opacity:0;transition:opacity .5s var(--ease)}
  #fl .map .ov.on{opacity:1}
  #fl .lbl{position:absolute;left:0;top:0;transform:translate(19px,-50%);display:inline-flex;align-items:center;gap:6px;padding:3px 6px;background:#fff;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--ink);white-space:nowrap;box-shadow:0 2px 8px rgba(22,22,22,.08);pointer-events:none;transition:opacity .4s,background .3s,color .3s}
  #fl .lbl.lft{transform:translate(calc(-100% - 19px),-50%)}
  #fl .lbl.up{transform:translate(-50%,calc(-100% - 10px))}
  #fl .lbl.dn{transform:translate(-50%,10px)}
  #fl .lbl.ctr{transform:translate(-50%,-50%)}
  #fl .lbl i{width:6px;height:6px;background:var(--c,var(--ink));flex:none}
  #fl .lbl em{font-style:normal;font-weight:600;color:var(--faint)}
  #fl .lbl.hide,#fl .lbl.off{opacity:0!important}
  #fl .lbl.warn{background:var(--orange-ink);color:#fff}
  #fl .lbl.bad{background:var(--red);color:#fff}
  #fl .lbl.ok{background:var(--accent);color:#fff}
  #fl .lbl.ag{background:var(--purple);color:#fff}
  #fl .lbl.warn em,#fl .lbl.bad em,#fl .lbl.ok em,#fl .lbl.ag em{color:rgba(255,255,255,.75)}
  #fl .lbl.dim{opacity:.25}
  #fl .leg{position:relative;display:grid;min-width:0}
  #fl .leg>div{grid-area:1/1;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px 0;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);opacity:0;transition:opacity .4s;white-space:nowrap}
  #fl .leg>div.on{opacity:1}
  #fl .leg span{display:inline-flex;align-items:center;gap:6px}
  #fl .leg i{display:inline-block;width:14px;height:3px;background:var(--c)}
  #fl .leg i.dsh{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}
  #fl .leg i.sq{width:7px;height:7px}
  #fl .scrub{width:min(46%,280px);flex:none;display:flex;align-items:center;gap:8px;padding:6px 0;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--faint);opacity:0;transition:opacity .4s}
  #fl .scrub.on{opacity:1}
  #fl .scrub svg{width:12px;height:12px;color:var(--blue)}
  #fl .scrub .tk{position:relative;flex:1;height:4px;background:var(--gray-20)}
  #fl .scrub .tk i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--blue)}
  #fl .scrub .tk b{position:absolute;top:-4px;width:3px;height:12px;background:var(--ink);left:0;transform:translateX(-1px)}


  /* basemap */
  #fl .stl{font-family:var(--mono);font-size:6.5px;font-weight:600;letter-spacing:1.4px;fill:#A9ACA2}
  #fl .stl.pk{fill:#93A385}
  #fl .stl.wt{fill:#8FA8BD;font-size:6px}
  #fl .ping{transform-box:fill-box;transform-origin:center;animation:flPing 2.8s var(--ease-out) infinite}
  @keyframes flPing{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.3);opacity:0}}
  #fl .map.dim .grp:not(.focus) .ping{animation:none;opacity:0}
  #fl .xm{transform-box:fill-box;transform-origin:center;transform:scale(0);opacity:0;transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .25s}
  #fl .xm.on{transform:scale(1);opacity:1}
  #fl .map path{transition:opacity .5s var(--ease)}
  #fl .lbl.sign{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--red),0 2px 8px rgba(22,22,22,.08)}
  #fl .lbl.sign b{font-weight:800}
  #fl .lbl.sign em{color:inherit;font-weight:700}
  #fl .lbl.sign.bad{background:var(--red);color:#fff;box-shadow:0 4px 14px rgba(218,30,40,.3)}
  #fl .lbl .tri{width:11px;height:10px;flex:none}
  #fl .lbl .tri path{fill:#fff;stroke:var(--red);stroke-width:1.6;stroke-linejoin:round}
  #fl .lbl.sign.bad .tri path{fill:var(--red);stroke:#fff}
  #fl .leg i.multi{background:linear-gradient(90deg,#015c11 0 25%,#1192e8 25% 50%,#b28600 50% 75%,#6929c4 75%)}
  #fl .leg i.hatch{width:12px;height:9px;background:repeating-linear-gradient(45deg,#da1e28 0 1px,#fff4f4 1px 4px);box-shadow:inset 0 0 0 1px #da1e28}
  #fl .leg i.sq.hol{background:#fff;box-shadow:inset 0 0 0 1.5px #161616}
  #fl .vr.rr{grid-template-columns:28px minmax(0,1fr) auto}
  #fl .vr .ri{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink)}
  #fl .vr .ri svg{width:15px;height:15px}
  #fl .cb{display:grid;grid-template-columns:70px minmax(0,1fr) 56px;gap:10px;align-items:center;padding:8px 10px;background:var(--scr)}
  #fl .cb b{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
  #fl .cb .v{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
  #fl .cb .tk{position:relative;height:8px;background:var(--gray-10)}
  #fl .cb .tk i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);transition:width 1s var(--ease-out)}
  #fl .cb .tk s{position:absolute;top:0;bottom:0;width:0;background:repeating-linear-gradient(135deg,var(--c2,var(--gray-50)) 0 3px,transparent 3px 6px);transition:width .8s var(--ease-out),left .8s var(--ease-out)}
  #fl .cb .tk u{position:absolute;top:-4px;bottom:-4px;width:2px;left:90.9%;background:var(--ink)}
  #fl .cb.x .v{color:var(--red)}

  /* ---------- side panel ---------- */
  #fl .side{position:relative;display:grid;background:#fff;min-width:0}
  #fl .pn{grid-area:1/1;padding:14px;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility 0s linear .4s;min-width:0;display:flex;flex-direction:column;gap:10px}
  #fl .pn.on{opacity:1;visibility:visible;transition:opacity .45s var(--ease),visibility 0s}
  #fl .ph{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--faint);white-space:nowrap}
  #fl .ph svg{width:13px;height:13px;color:var(--pc,var(--ink))}
  #fl .ph .r{margin-left:auto;font-weight:600;color:var(--sub);letter-spacing:.06em}
  #fl .in{opacity:0;transform:translateY(6px);transition:opacity .4s var(--ease),transform .5s var(--ease-out)}
  #fl .in.on{opacity:1;transform:none}

  /* vehicle rows */
  #fl .vl{display:flex;flex-direction:column;gap:2px}
  #fl .vr{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--scr)}
  #fl .vr>i{width:8px;height:8px;background:var(--c)}
  #fl .vr b{display:block;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink);letter-spacing:.04em}
  #fl .vr small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fl .chip{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:3px 6px;white-space:nowrap;background:var(--gray-10);color:var(--muted);transition:background .3s,color .3s}
  #fl .chip.mv{background:var(--g-050);color:var(--accent)}
  #fl .chip.os{background:var(--blue-050);color:var(--blue)}
  #fl .chip.idle,#fl .chip.due{background:var(--orange-050);color:var(--orange-ink)}
  #fl .chip.bad{background:var(--red);color:#fff}
  #fl .chip.ok{background:var(--accent);color:#fff}
  #fl .chip.bk{background:var(--blue-050);color:var(--blue)}
  #fl .chip.sk{background:#fff;color:var(--faint);box-shadow:inset 0 0 0 1px var(--gray-20)}
  #fl .chip.ag{background:var(--purple-050);color:var(--purple)}
  /* log */
  #fl .log{display:flex;flex-direction:column;gap:2px;height:calc(4 * 30px + 6px);overflow:hidden}
  #fl .lg{display:grid;grid-template-columns:40px 8px minmax(0,1fr);gap:8px;align-items:center;height:30px;padding:0 10px;background:var(--scr);font-size:11.5px;color:var(--muted);animation:flIn .45s var(--ease-out)}
  #fl .lg b{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink)}
  #fl .lg i{width:8px;height:8px;background:var(--c)}
  #fl .lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @keyframes flIn{from{opacity:0;transform:translateY(-6px)}}
  #fl .src{display:flex;align-items:center;gap:8px;margin-top:auto;padding:8px 10px;background:var(--blue-050);font-size:11.5px;color:var(--muted)}
  #fl .src svg{width:14px;height:14px;color:var(--blue)}
  #fl .src b{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.08em;color:var(--blue);margin-left:auto;white-space:nowrap}

  /* bars */
  #fl .hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 10px;background:var(--scr)}
  #fl .hb b{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fl .hb b em{font-style:normal;font-weight:500;color:var(--faint);font-family:var(--mono);font-size:9.5px;margin-left:6px}
  #fl .hb .v{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink);white-space:nowrap}
  #fl .hb .tk{grid-column:1/-1;position:relative;height:8px;background:var(--gray-10)}
  #fl .hb .tk i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);transition:width 1s var(--ease-out),background .3s}
  #fl .hb .tk s{position:absolute;top:0;bottom:0;width:0;background:repeating-linear-gradient(135deg,var(--c2,var(--gray-50)) 0 3px,transparent 3px 6px);transition:width .8s var(--ease-out),left .8s var(--ease-out),opacity .3s}
  #fl .hb .tk u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
  #fl .hb.x .v{color:var(--red)}
  /* cards */
  #fl .card{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px;background:var(--cb,var(--scr));box-shadow:inset 2px 0 0 var(--cc,transparent)}
  #fl .card .ci{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--cc,var(--ink));color:#fff}
  #fl .card .ci svg{width:15px;height:15px}
  #fl .card b{display:block;font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.35}
  #fl .card small{display:block;margin-top:2px;font-size:11.5px;line-height:1.45;color:var(--muted)}
  #fl .card small strong{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--cc)}
  #fl .card.c-ok{--cc:var(--accent);--cb:var(--g-050)}
  #fl .card.c-warn{--cc:var(--orange-ink);--cb:var(--orange-050)}
  #fl .card.c-bad{--cc:var(--red);--cb:var(--red-050)}
  #fl .card.c-info{--cc:var(--blue);--cb:var(--blue-050)}
  #fl .card.c-ag{--cc:var(--purple);--cb:var(--purple-050)}
  #fl .card.c-ink{--cc:var(--ink);--cb:var(--scr)}
  #fl .idle{grid-column:2;position:relative;height:6px;background:rgba(198,83,0,.12);margin-top:8px}
  #fl .idle i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--orange-ink)}
  #fl .idle u{position:absolute;left:33.33%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
  #fl .msg{padding:10px 12px;background:var(--ink);color:#fff;font-size:12px;line-height:1.45}
  #fl .msg small{display:block;font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.1em;color:#9CFF8F;margin-bottom:4px}
  #fl .bat{grid-column:2;display:flex;gap:2px;margin-top:8px}
  #fl .bat i{flex:1;height:6px;background:var(--gray-20);transition:background .3s}
  #fl .bat i.f{background:var(--accent)}
  #fl .bat i.r{background:var(--g-050);box-shadow:inset 0 0 0 1px var(--accent)}

  /* ---------- lens copy (below the frame) ---------- */
  #fl .copy{display:grid;margin-top:clamp(28px,3.4vw,40px)}
  #fl .cp{grid-area:1/1;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);align-items:start;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .45s var(--ease),transform .55s var(--ease-out),visibility 0s linear .45s}
  #fl .cp.on{opacity:1;visibility:visible;transform:none;transition:opacity .5s var(--ease),transform .6s var(--ease-out),visibility 0s}
  #fl .cp .k{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lt)}
  #fl .cp .k svg{width:14px;height:14px}
  #fl .cp h3{margin:10px 0 0;font-size:clamp(22px,2.3vw,28px);font-weight:600;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
  #fl .cp p{margin:10px 0 0;font-size:1rem;line-height:1.6;max-width:44ch}
  #fl .cp ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  #fl .cp li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;font-size:.95rem;line-height:1.45;color:var(--ink)}
  #fl .cp li+li{box-shadow:inset 0 1px 0 var(--gray-10)}
  #fl .cp li svg{width:17px;height:17px;color:var(--lt)}
  #fl .cp li em{font-style:normal;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;color:var(--accent);white-space:nowrap}
  #fl .cp li em.api{color:var(--blue)}
  #fl .note{margin-top:24px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;color:var(--gray-30)}

      T(function(){ lensLbl(['naive']); tween(1100,function(e){ var o=(NL*(1-e)).toFixed(1); naiveP.setAttribute('stroke-dashoffset',o); naiveC.setAttribute('stroke-dashoffset',o); }); },400);
      T(function(){ tween(900,function(e){ zclipR.setAttribute('width',(230*e).toFixed(1)); }); lensLbl(['naive','bridge','zsign']); },1700);
      T(function(){ seg1.style.opacity='1'; xm1.classList.add('on'); LB.bridge.className='lbl lft sign bad'; LB.bridge.innerHTML=TRI+'<b>3.6 M</b><em>TRUCK 4.1 M</em>'; chip('r0c','bad','BREACH'); },2900);

  /* ================= autoplay ================= */
  var playing=!reduce, inView=false, hover=false, tick=null, t0=0, spent=0, started=false, paused=false;
  function running(){ return !paused&&inView; }
  function advancing(){ return playing&&!paused&&inView&&!hover&&cur>-1; }
  function sched(){ spent=0; t0=0; sync(); }
  function sync(){
    tabs.forEach(function(b){ b.classList.toggle('hold',!advancing()); });
    clearTimeout(tick); tick=null;
    if(advancing()){ t0=Date.now(); tick=setTimeout(function(){ lens((cur+1)%L.length); },Math.max(300,L[cur].dw-spent)); }
    else if(t0){ spent+=Date.now()-t0; t0=0; }
  }
  function userLens(i){ playing=false; paused=false; setPlayIcon(); tabs.forEach(function(b){ b.classList.remove('run'); }); lens(i); }
  function setPlayIcon(){ var b=$('flPlay'); b.innerHTML=ic(paused?'play':'pause'); b.setAttribute('aria-label',paused?'Play':'Pause'); }
  $('flPlay').addEventListener('click',function(){ paused=!paused; if(!paused&&!playing){ playing=!reduce; tabs[cur].classList.add('run'); } setPlayIcon(); sync(); });
  setPlayIcon();
  var frame=$('flFrame');
  frame.addEventListener('mouseenter',function(){ hover=true; sync(); });
  frame.addEventListener('mouseleave',function(){ hover=false; sync(); });
  frame.addEventListener('pointermove',function(e){ var r=frame.getBoundingClientRect(); frame.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%'); frame.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%'); });

  /* first paint */
  tabs[0].classList.add('on'); pns[0].classList.add('on'); cps[0].classList.add('on'); legs[0].classList.add('on'); lensLbl([]); render();
  var reveals=root.querySelectorAll('.reveal');
  if('IntersectionObserver' in window && !reduce){
    var ro=new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); ro.unobserve(e.target);} }); },{threshold:.1});
    reveals.forEach(function(x){ro.observe(x);});
    var vo=new IntersectionObserver(function(es){ inView=es[0].isIntersecting; if(inView){ startLoop(); if(!started){ started=true; lens(0); } else sync(); } else { sync(); stopLoop(); } },{threshold:.3});
    vo.observe(frame);
  } else { reveals.forEach(function(x){x.classList.add('in');}); inView=true; startLoop(); lens(0); }
})();
</script>

<script>
/* iframe helper: report real height to the parent page */
(function(){
  if(window.parent===window)return;
  var last=0;
  function send(){
    var h=Math.ceil(document.documentElement.getBoundingClientRect().height);
    if(h&&h!==last){last=h;window.parent.postMessage({syncnoxFrame:'fleet',height:h},'*');}
  }
  if('ResizeObserver' in window){new ResizeObserver(send).observe(document.documentElement);}
  window.addEventListener('load',send);
  window.addEventListener('resize',send);
  send();
})();
</script>
